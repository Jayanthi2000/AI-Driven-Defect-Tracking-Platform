# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/defect_tracker_db
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# App Name
spring.application.name=Defect-Tracker-ai

# H2 Disable
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration
# JWT Configuration
jwt.secret=futuredevs-defect-tracker-secret-key-2024
jwt.expiration=86400000
spring.web.cors.allowed-origins=*
